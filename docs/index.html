    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);

    header h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.25rem; }
    header p { color: var(--muted); font-size: 0.85rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .control-group { display: flex; align-items: center; gap: 0.5rem; }
    label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
    button {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .toggle-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .toggle-group button {
      border: none;
      border-radius: 0;
      border-right: 1px solid var(--border);
    }
    .toggle-group button:last-child { border-right: none; }
    .toggle-group button.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      flex: 1;
      min-height: 320px;
      min-height: 480px;
    }
    #map { width: 100%; height: 100%; background: #0b1220; }
    .sidebar {
      border-left: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .sidebar h2 { font-size: 0.95rem; font-weight: 600; }
    .sidebar .sub { color: var(--muted); font-size: 0.78rem; line-height: 1.45; }
    .sidebar-actions { display: flex; gap: 0.5rem; }
    .sidebar-actions button {
      flex: 1;
      font-size: 0.78rem;
      padding: 0.35rem 0.5rem;
    }
    .metric-options {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .metric-option {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      padding: 0.5rem 0.6rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .metric-option:hover { border-color: #475569; }
    .metric-option.checked {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .metric-option input {
      margin-top: 2px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .metric-option .opt-label {
      font-size: 0.8rem;
      line-height: 1.35;
      cursor: pointer;
      user-select: none;
    }
    .metric-option .opt-label small {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      margin-top: 0.15rem;
    }
    .legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      min-width: 180px;
      backdrop-filter: blur(6px);
    }
    .legend h3 { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.5rem; line-height: 1.35; }
    .legend-bar {
      height: 12px;
      border-radius: 4px;
      margin-bottom: 0.35rem;
      background: linear-gradient(90deg, #1e3a5f, #38bdf8, #fef08a, #ef4444);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .sources {
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .leaflet-container { background: #0b1220; }
    .state-value-marker {
      background: transparent !important;
      border: none !important;
    }
    .state-value-marker .st-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-sizing: border-box;
      font-family: Roboto, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      pointer-events: none;
      transition: opacity 0.18s ease-out;
    }
    .state-value-marker .st-abbr {
      font-weight: 500;
      color: #e8eaed;
      text-align: center;
      line-height: 1.15;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 0.85),
        0 0 4px rgba(0, 0, 0, 0.65),
        1px 1px 0 rgba(0, 0, 0, 0.55),
        -1px -1px 0 rgba(0, 0, 0, 0.55);
      flex-shrink: 0;
      margin-bottom: 0;
    }
    .state-value-marker .st-values {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
    }
    .state-value-marker .st-val {
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      -webkit-font-smoothing: antialiased;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 0.85),
        0 0 4px rgba(0, 0, 0, 0.65),
        1px 1px 0 rgba(0, 0, 0, 0.55),
        -1px -1px 0 rgba(0, 0, 0, 0.55);
    }
    .metric-option .color-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .btn-report {
      margin-left: auto;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--accent);
      font-weight: 600;
    }
    .btn-report:hover {
      background: rgba(56, 189, 248, 0.22);
    }
    select#state-report-select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.85rem;
      max-width: 220px;
      cursor: pointer;
    }
    select#state-report-select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .leaflet-popup-tip { background: #1e293b; }
    .leaflet-popup-content { margin: 0.75rem 0.85rem; }
    .hfa-popup-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .hfa-popup-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }
    .hfa-popup-links {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .hfa-popup-links a {
      color: var(--accent);
      font-size: 0.8rem;
      text-decoration: none;
    }
    .hfa-popup-links a:hover { text-decoration: underline; }
    .hfa-popup-empty {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .report-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: stretch;
      justify-content: center;
      padding: 1rem;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(4px);
    }
    .report-modal.open { display: flex; }
    .report-panel {
      width: min(960px, 100%);
      max-height: 100%;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .report-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .report-close {
      flex-shrink: 0;
      min-width: 2rem;
      padding: 0.35rem 0.65rem;
    }
    .report-body {
      overflow: auto;
      padding: 1.25rem 1.5rem 1.75rem;
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text);
    }
    .report-body p { margin: 0 0 0.85rem; }
    .report-body h1 {
      font-size: 1.15rem;
      margin: 1.35rem 0 0.65rem;
      color: #e2e8f0;
    }
    .report-body h2 {
      font-size: 0.98rem;
      margin: 1.1rem 0 0.55rem;
      color: #cbd5e1;
    }
    .report-body strong { color: #f8fafc; }
    .report-body em { color: var(--muted); }
    .report-body ul, .report-body ol {
      margin: 0 0 0.85rem 1.2rem;
    }
    .report-body li { margin-bottom: 0.35rem; }
    .report-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0 1rem;
      font-size: 0.78rem;
      display: block;
      overflow-x: auto;
    }
    .report-body td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      vertical-align: top;
      white-space: nowrap;
    }
    .report-body td p { margin: 0; }
    .report-body tr:first-child td {
      background: rgba(56, 189, 248, 0.12);
      font-weight: 600;
    }
    .report-loading, .report-error {
      color: var(--muted);
      padding: 2rem 0;
      text-align: center;
    }
    .site-footer {
      margin-top: auto;
      padding: 14px 20px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      line-height: 1.7;
      color: #9aa4b2;
      text-align: center;
      background: var(--panel);
    }
    .site-footer a {
      color: inherit;
      text-decoration: underline;
    }
    .site-footer a:hover { color: var(--accent); }
    .site-footer strong { color: #cbd5e1; font-weight: 600; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
      .sidebar { border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
    }
  </style>
</head>
<body>
  <header>

  <div class="report-modal" id="report-modal" aria-hidden="true">
    <div class="report-panel" role="dialog" aria-modal="true" aria-labelledby="report-title">

      if (!measureCtx) {
        const canvas = document.createElement("canvas");
        measureCtx = canvas.getContext("2d");
      }
      return measureCtx;
    }

    function measureTextWidth(text, fontSize, weight = 500) {
      const ctx = getMeasureCtx();
      ctx.font = `${weight} ${fontSize}px Roboto, sans-serif`;
      return ctx.measureText(text).width;
    }

    function fitFontToWidth(texts, fontSize, maxWidth, weight = 500) {
      if (!texts.length || maxWidth <= 0) return fontSize;
      let fs = fontSize;
      const longest = texts.reduce((a, b) => (a.length >= b.length ? a : b), texts[0]);
      while (fs > MIN_LABEL_PX && measureTextWidth(longest, fs, weight) > maxWidth * 0.96) {
        fs -= 0.25;
      }
      return fs;
    }

    function dampedExtent(extent) {
      if (extent <= 0) return 0;
      return Math.pow(extent / LABEL_REF_EXTENT, LABEL_EXTENT_POWER) * LABEL_REF_EXTENT;
    }

    function googleMapsLabelOpacity(fontSize) {
      if (fontSize < MIN_LABEL_PX) return 0;
      if (fontSize >= 10) return 1;
      return Math.min(1, (fontSize - 6) / 4);
    }

    function googleMapsFontSize(maxW, maxH, lineCount, texts) {
      const extent = dampedExtent(Math.min(maxW, maxH));
      let valFs = extent * LABEL_SIZE_RATIO / Math.pow(Math.max(lineCount - 1, 1), 0.38);
      valFs = Math.min(valFs, maxH / (lineCount * LINE_HEIGHT + 0.2));
      valFs = fitFontToWidth(texts, valFs, maxW);
      return Math.max(MIN_LABEL_PX, Math.min(MAX_LABEL_PX, valFs));
    }

    const METRIC_COLORS = {
      net_position: "#38bdf8",
      net_position_growth_pct: "#22d3ee",
      net_position_per_capita: "#67e8f9",
      total_assets: "#2dd4bf",
      total_liabilities: "#fb7185",
      leverage_ratio: "#f43f5e",
      families_served: "#a78bfa",
      staff_count: "#fb923c",
      population: "#4ade80",
      personal_income_total: "#facc15",
      personal_income_per_capita: "#fde047",
      unemployment_rate: "#f87171",
      poverty_rate: "#ef4444",
      median_home_price: "#f472b6",
      homeless_count: "#c084fc",

    const STATE_ABBR = {
      Alabama:"AL",Alaska:"AK",Arizona:"AZ",Arkansas:"AR",California:"CA",Colorado:"CO",
      Connecticut:"CT",Delaware:"DE",Florida:"FL",Georgia:"GA",Hawaii:"HI",Idaho:"ID",
      Illinois:"IL",Indiana:"IN",Iowa:"IA",Kansas:"KS",Kentucky:"KY",Louisiana:"LA",
      Maine:"ME",Maryland:"MD",Massachusetts:"MA",Michigan:"MI",Minnesota:"MN",
      Mississippi:"MS",Missouri:"MO",Montana:"MT",Nebraska:"NE",Nevada:"NV",
      "New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY",
      "North Carolina":"NC","North Dakota":"ND",Ohio:"OH",Oklahoma:"OK",Oregon:"OR",
      Pennsylvania:"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD",
      Tennessee:"TN",Texas:"TX",Utah:"UT",Vermont:"VT",Virginia:"VA",Washington:"WA",
      "West Virginia":"WV",Wisconsin:"WI",Wyoming:"WY",
      "District of Columbia":"DC",
    };

    let lang = "en", year = "2025";
    let dataset = null, stateLayer = null;
    let reportLinks = {};
    const reportCache = {};
    let reportOpen = false;
    const selectedMetrics = new Set(["net_position"]);
    const layerByAbbr = new Map();
    const markerLayer = L.layerGroup();

    const map = L.map("map", {
      zoomControl: true,

      attribution: '&copy; OpenStreetMap &copy; CARTO',

    }).addTo(map);
    markerLayer.addTo(map);

    function t(key) { return I18N[lang][key] ?? key; }
    function tMetric(k) { return I18N[lang].metrics[k] ?? k; }
    function sourceText(key) {
      return SOURCE_I18N[lang]?.[key] ?? dataset?.sources?.[key] ?? key;
    }
    function renderSources() {
      if (!dataset?.sources) return;

      document.getElementById("sources").innerHTML =

    /**
     * GoatCounter (private dashboard, not shown on the map).
     * 1) Create a free site at https://www.goatcounter.com
     * 2) Put the subdomain code below (e.g. "ushfamap" → https://ushfamap.goatcounter.com)
     * Localhost / file:// are skipped.
     */
    const GOATCOUNTER_CODE = "ushfamap";

    function initAnalytics() {
      const code = (GOATCOUNTER_CODE || "").trim();
      if (!code) return;
      const host = location.hostname;
      if (!host || host === "localhost" || host === "127.0.0.1") return;
      if (location.protocol === "file:") return;
      const s = document.createElement("script");
      s.async = true;
      s.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
      s.src = "https://gc.zgo.at/count.js";
      document.head.appendChild(s);
    }

    function reportPath() {
      return lang === "zh" ? "reports/fy2025-zh.html" : "reports/fy2025-en.html";
    }

    async function loadReportHtml(force = false) {
      const path = reportPath();
      if (!force && reportCache[path]) return reportCache[path];
      const resp = await fetch(path);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const html = await resp.text();
      reportCache[path] = html;
      return html;
    }

    async function renderReportContent() {
      const body = document.getElementById("report-body");
      document.getElementById("report-title").textContent = t("reportTitle");
      body.innerHTML = `<div class="report-loading">${t("reportLoading")}</div>`;
      try {
        body.innerHTML = await loadReportHtml();
      } catch (_err) {
        body.innerHTML = `<div class="report-error">${t("reportError")}</div>`;
      }
    }

    function openReport() {
      reportOpen = true;
      const modal = document.getElementById("report-modal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

    function closeReport() {
      reportOpen = false;
      const modal = document.getElementById("report-modal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function hasMetricValue(val) {
      return val != null && val !== "" && !Number.isNaN(Number(val));
    }

    function yearMetrics(rec) {
      const yd = { ...(rec?.[year] || {}) };
      const np = Number(yd.net_position);
      const pop = Number(yd.population);
      const assets = Number(yd.total_assets);
      const liab = Number(yd.total_liabilities);
      if (hasMetricValue(yd.net_position) && hasMetricValue(yd.population) && pop > 0) {
        yd.net_position_per_capita = np / pop;
      }
      if (hasMetricValue(yd.total_assets) && hasMetricValue(yd.total_liabilities) && assets > 0) {
        yd.leverage_ratio = liab / assets;
      }
      return yd;
    }

    function metricValueForState(rec, mkey) {
      if (!mkey) return null;
      const yd = yearMetrics(rec);
      return hasMetricValue(yd[mkey]) ? Number(yd[mkey]) : null;
    }

    function fmtDisplay(val, key) {
      if (!hasMetricValue(val)) return null;
      return fmt(val, key);
    }

    function fmt(val, key) {
      if (!hasMetricValue(val)) return t("na");
      if (key === "leverage_ratio") return `${Number(val).toFixed(2)}×`;
      if (key.includes("rate") || key.includes("pct") || key.includes("growth")) return `${Number(val).toFixed(1)}%`;
      if (key.includes("population") || key.includes("families") || key.includes("staff") || key.includes("homeless")) {
        const n = Number(val);
        if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
        if (n >= 1e3) return `${(n / 1e3).toFixed(0)}K`;
        return n.toLocaleString(lang === "zh" ? "zh-CN" : "en-US");
      }
      if (key.includes("income") || key.includes("assets") || key.includes("liabilit") || key.includes("position") || key.includes("price") || key.includes("median")) {
        const n = Number(val);
        if (Math.abs(n) >= 1e12) return `$${(n / 1e12).toFixed(1)}T`;
        if (Math.abs(n) >= 1e9) return `$${(n / 1e9).toFixed(1)}B`;
        if (Math.abs(n) >= 1e6) return `$${(n / 1e6).toFixed(0)}M`;
        if (Math.abs(n) >= 1e3) return `$${(n / 1e3).toFixed(0)}K`;
        return `$${Math.round(n).toLocaleString(lang === "zh" ? "zh-CN" : "en-US")}`;
      }
      return Number(val).toLocaleString();
    }

    function getStateData(abbr) {
      return dataset?.states?.find(s => s.state === abbr);
    }

    function getReportLinks(abbr) {
      return reportLinks?.[abbr] || null;
    }

    function buildReportPopupHtml(abbr) {
      const rec = getStateData(abbr);
      const links = getReportLinks(abbr);
      const title = rec?.hfa_name || links?.hfa_name || abbr;
      const sub = [abbr, rec?.hfa_abbr || links?.hfa_abbr].filter(Boolean).join(" · ");
      const items = [];
      if (links?.page_url) {
        items.push(`<a href="${links.page_url}" target="_blank" rel="noopener noreferrer">${t("reportPageLink")}</a>`);
      }
      if (links?.fy2025_pdf) {
        items.push(`<a href="${links.fy2025_pdf}" target="_blank" rel="noopener noreferrer">${t("reportFy2025Pdf")}</a>`);
      }
      const body = items.length
        ? `<div class="hfa-popup-links">${items.join("")}</div>`
        : `<div class="hfa-popup-empty">${t("reportNoLinks")}</div>`;
      return `<div class="hfa-popup-title">${title}</div><div class="hfa-popup-sub">${sub}</div>${body}`;
    }

    function openStateReportPopup(abbr) {
      const layer = layerByAbbr.get(abbr);
      if (!layer) return;
      const select = document.getElementById("state-report-select");
      if (select) select.value = abbr;
      layer.setPopupContent(buildReportPopupHtml(abbr));
      layer.openPopup();
    }

    function populateReportSelect() {
      const select = document.getElementById("state-report-select");
      if (!select || !dataset?.states) return;
      const current = select.value;
      const opts = [`<option value="">${t("reportSelectPlaceholder")}</option>`];
      for (const s of [...dataset.states].sort((a, b) => a.state.localeCompare(b.state))) {
        const label = lang === "zh"
          ? `${s.state} · ${s.name_zh || s.name_en}`
          : `${s.state} · ${s.name_en || s.hfa_name || s.state}`;
        opts.push(`<option value="${s.state}">${label}</option>`);
      }
      select.innerHTML = opts.join("");
      if (current && [...select.options].some(o => o.value === current)) select.value = current;
    }

    function primaryMetric() {
      for (const k of METRIC_KEYS) {
        if (selectedMetrics.has(k)) return k;
      }
      return null;
    }

    function metricValues(mkey) {
      if (!dataset || !mkey) return [];
      return dataset.states
        .map(s => metricValueForState(s, mkey))
        .filter(v => v != null && !Number.isNaN(v));
    }

    function metricRange(mkey) {
      const vals = metricValues(mkey);
      if (!vals.length) return { min: 0, max: 1 };
      // Winsorize extreme YoY growth outliers so choropleth stays readable.
      if (mkey === "net_position_growth_pct" && vals.length >= 5) {
        const sorted = [...vals].sort((a, b) => a - b);
        const lo = sorted[Math.floor((sorted.length - 1) * 0.05)];
        const hi = sorted[Math.floor((sorted.length - 1) * 0.95)];
        if (lo !== hi) return { min: lo, max: hi };
      }
      return { min: Math.min(...vals), max: Math.max(...vals) };
    }

    function colorScale(val, min, max) {
      if (val == null || min == null || max == null || min === max) return "#334155";
      const t = (val - min) / (max - min);
      const stops = [
        [0, [30, 58, 95]], [0.35, [56, 189, 248]], [0.65, [254, 240, 138]], [1, [239, 68, 68]],
      ];
      let lo = stops[0], hi = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (t >= stops[i][0] && t <= stops[i + 1][0]) { lo = stops[i]; hi = stops[i + 1]; break; }
      }
      const lt = (t - lo[0]) / (hi[0] - lo[0] || 1);
      const rgb = lo[1].map((c, i) => Math.round(c + (hi[1][i] - c) * lt));
      return `rgb(${rgb.join(",")})`;
    }

    function flattenPolygonRings(latlngs) {
      const rings = [];
      if (!latlngs || !latlngs.length) return rings;
      if (latlngs[0] && latlngs[0].lat !== undefined) {
        rings.push(latlngs);
        return rings;
      }
      for (const part of latlngs) {
        if (!part || !part.length) continue;
        if (part[0] && part[0].lat !== undefined) {
          rings.push(part);
        } else if (part[0] && part[0].length && part[0][0] && part[0][0].lat !== undefined) {
          rings.push(part[0]);
        }
      }
      return rings;
    }

    function pointsPixelBox(points) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of points) {
        if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) continue;
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
      }
      if (!Number.isFinite(minX)) return null;
      const width = Math.max(0, maxX - minX);
      const height = Math.max(0, maxY - minY);
      return {
        width,
        height,
        minX,
        maxX,
        minY,
        maxY,
        cx: (minX + maxX) / 2,
        cy: (minY + maxY) / 2,
        area: width * height,
      };
    }

    function getStatePixelBox(layer) {
      const rings = flattenPolygonRings(layer.getLatLngs());
      let best = null;
      for (const ring of rings) {
        if (!ring || ring.length < 3) continue;
        const box = pointsPixelBox(ring.map(ll => map.latLngToContainerPoint(ll)));
        if (!box || box.width < 2 || box.height < 2) continue;
        if (!best || box.area > best.area) best = box;
      }
      if (best) return best;

      const bounds = layer.getBounds();
      const nw = map.latLngToContainerPoint(bounds.getNorthWest());
      const se = map.latLngToContainerPoint(bounds.getSouthEast());
      const minX = Math.min(nw.x, se.x);
      const maxX = Math.max(nw.x, se.x);
      const minY = Math.min(nw.y, se.y);
      const maxY = Math.max(nw.y, se.y);
      const width = maxX - minX;
      const height = maxY - minY;
      return {
        width,
        height,
        minX,
        maxX,
        minY,
        maxY,
        cx: (minX + maxX) / 2,
        cy: (minY + maxY) / 2,
        area: width * height,
      };
    }

    function pixelBoxToLatLng(box) {
      return map.containerPointToLatLng(L.point(box.cx, box.cy));
    }

    function formatMetricLine(k, text, showName) {
      return showName ? `${tMetric(k)}: ${text}` : text;
    }

    function computeLabelLayout(layer, abbr) {
      const selected = METRIC_KEYS.filter(k => selectedMetrics.has(k));
      if (!selected.length) return null;

      const rec = getStateData(abbr);
      const yd = yearMetrics(rec);
      const metrics = selected.filter(k => hasMetricValue(yd[k]));
      const showMetricNames = selected.length > 1;
      const valueTexts = metrics
        .map(k => {
          const text = fmtDisplay(yd[k], k);
          return text ? formatMetricLine(k, text, showMetricNames) : null;
        })
        .filter(Boolean);

      const px = getStatePixelBox(layer);
      const maxW = px.width * (1 - LABEL_PAD * 2);
      const maxH = px.height * (1 - LABEL_PAD * 2);
      if (maxW < 16 || maxH < 12) return null;

      const lineCount = 1 + valueTexts.length;
      const fitTexts = valueTexts.length ? valueTexts : [abbr];
      let valFs = googleMapsFontSize(maxW, maxH, lineCount, fitTexts);
      if (valFs < MIN_LABEL_PX) return null;

      const opacity = googleMapsLabelOpacity(valFs);
      if (opacity <= 0) return null;

      const abbrFs = Math.min(valFs * 1.1, maxH * 0.28, MAX_LABEL_PX + 1);
      valFs = Math.round(valFs * 10) / 10;
      const abbrFsRounded = Math.round(abbrFs * 10) / 10;
      const valLineH = Math.ceil(valFs * LINE_HEIGHT);
      const abbrLineH = Math.ceil(abbrFsRounded * LINE_HEIGHT);

      const abbrW = measureTextWidth(abbr, abbrFsRounded, 500);
      let maxValW = 0;
      for (const text of valueTexts) {
        maxValW = Math.max(maxValW, measureTextWidth(text, valFs, 500));
      }
      const chartW = Math.min(maxW, Math.max(abbrW, maxValW) + 6);
      const chartH = abbrLineH + valueTexts.length * valLineH + 2;

      return {
        metrics,
        showMetricNames,
        chartW,
        chartH,
        valFs,
        abbrFs: abbrFsRounded,
        valLineH,
        abbrLineH,
        opacity,
        latlng: pixelBoxToLatLng(px),
      };
    }

    function buildMarkerHtml(abbr, layout) {
      const rec = getStateData(abbr);
      const yd = yearMetrics(rec);
      const rows = layout.metrics.map(k => {
        const val = yd[k];
        const text = fmtDisplay(val, k);
        if (!text) return "";
        const line = formatMetricLine(k, text, layout.showMetricNames);
        const color = METRIC_COLORS[k] || "#e8eaed";
        let tip = `${tMetric(k)}: ${text}`;
        if (k === "staff_count") {
          const src = yd.staff_count_source || rec?.staff_count_source;
          if (src) tip += ` (${src})`;
        }
        return `<div class="st-val" style="color:${color};font-size:${layout.valFs}px;line-height:${layout.valLineH}px;height:${layout.valLineH}px" title="${tip}">${line}</div>`;
      }).join("");
      return `<div class="st-wrap" style="width:${layout.chartW}px;height:${layout.chartH}px;opacity:${layout.opacity}">
        <div class="st-abbr" style="font-size:${layout.abbrFs}px;line-height:${layout.abbrLineH}px;height:${layout.abbrLineH}px">${abbr}</div>
        <div class="st-values">${rows}</div>
      </div>`;
    }

    function updateLayerLabels() {
      markerLayer.clearLayers();
      if (!selectedMetrics.size) return;

      layerByAbbr.forEach((layer, abbr) => {
        const layout = computeLabelLayout(layer, abbr);
        if (!layout) return;
        const html = buildMarkerHtml(abbr, layout);
        const icon = L.divIcon({
          className: "state-value-marker",
          html,
          iconSize: [layout.chartW, layout.chartH],
          iconAnchor: [layout.chartW / 2, layout.chartH / 2],
        });
        L.marker(layout.latlng, { icon, interactive: false, zoomAnimation: false }).addTo(markerLayer);
      });
    }

    function styleFeature(feature) {
      const abbr = STATE_ABBR[feature.properties.name];
      const mkey = primaryMetric();
      const rec = getStateData(abbr);
      const val = metricValueForState(rec, mkey);
      const { min, max } = metricRange(mkey);
      const hasScale = metricValues(mkey).length > 0;
      return {
        fillColor: mkey && hasScale ? colorScale(val, min, max) : "#1e293b",
        weight: 1,
        opacity: 1,
        color: "#64748b",
        fillOpacity: mkey && val != null ? 0.78 : 0.35,
      };
    }

    function onEachFeature(feature, layer) {
      const abbr = STATE_ABBR[feature.properties.name];
      if (!abbr) return;
      layerByAbbr.set(abbr, layer);
      layer.bindPopup(() => buildReportPopupHtml(abbr), {
        maxWidth: 320,
        className: "hfa-popup",
      });
      layer.on({
        mouseover: e => e.target.setStyle({ weight: 2.5, color: "#e2e8f0" }),
        mouseout: e => stateLayer.resetStyle(e.target),
        click: () => {
          const select = document.getElementById("state-report-select");
          if (select) select.value = abbr;
        },
      });
    }

    function refreshMap() {
      if (stateLayer) stateLayer.setStyle(styleFeature);
      updateLayerLabels();
      updateLegend();
    }

    function updateLegend() {
      const mkey = primaryMetric();
      const legendEl = document.getElementById("legend");
      if (!mkey) {
        document.getElementById("legend-title").textContent = t("legend");
        document.getElementById("legend-min").textContent = "—";
        document.getElementById("legend-max").textContent = "—";
        legendEl.style.opacity = "0.5";
        return;
      }
      legendEl.style.opacity = "1";
      document.getElementById("legend-title").textContent =
        `${t("legend")} · ${t("colorBy")}: ${tMetric(mkey)} (${year})`;
      const vals = metricValues(mkey);
      if (!vals.length) {
        document.getElementById("legend-min").textContent = t("na");
        document.getElementById("legend-max").textContent = t("na");
        return;
      }
      const { min, max } = metricRange(mkey);
      document.getElementById("legend-min").textContent = fmt(min, mkey);
      document.getElementById("legend-max").textContent = fmt(max, mkey);
    }

    function renderMetricOptions() {
      const container = document.getElementById("metric-options");
      container.innerHTML = METRIC_KEYS.map(k => {
        const checked = selectedMetrics.has(k);
        const color = METRIC_COLORS[k] || "#94a3b8";
        return `<label class="metric-option ${checked ? "checked" : ""}" data-key="${k}">
          <span class="color-dot" style="background:${color}"></span>
          <input type="checkbox" value="${k}" ${checked ? "checked" : ""} />
          <span class="opt-label">${tMetric(k)}</span>
        </label>`;
      }).join("");

      container.querySelectorAll(".metric-option").forEach(el => {
        const k = el.dataset.key;
        const input = el.querySelector("input");
        const toggle = () => {
          if (input.checked) selectedMetrics.add(k);
          else selectedMetrics.delete(k);
          el.classList.toggle("checked", input.checked);
          refreshMap();
        };
        input.addEventListener("change", toggle);
        el.addEventListener("click", e => {
          if (e.target === input) return;
          input.checked = !input.checked;
          toggle();
        });
      });
    }

    function renderFooter() {
      document.getElementById("footer-credit").textContent = t("footerCredit");
      document.getElementById("footer-code-label").textContent = t("footerCode");
      document.getElementById("footer-content-label").textContent = t("footerContent");
      document.getElementById("footer-mit-link").textContent = t("footerMit");
      const cc = document.getElementById("footer-cc-link");
      cc.textContent = t("footerCc");
      cc.href = lang === "zh" ? "license-content-zh.html" : "license-content-en.html";
      document.getElementById("footer-disclaimer").textContent = t("footerDisclaimer");
    }

    function renderControls() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.getElementById("title").textContent = t("title");
      document.getElementById("subtitle").textContent = t("subtitle");
      document.getElementById("lbl-lang").textContent = t("lblLang");
      document.getElementById("lbl-reports").textContent = t("lblReports");
      document.getElementById("sidebar-title").textContent = t("sidebarTitle");
      document.getElementById("sidebar-hint").textContent = t("sidebarHint");
      document.getElementById("btn-select-all").textContent = t("selectAll");
      document.getElementById("btn-clear-all").textContent = t("clearAll");
      document.getElementById("btn-report").textContent = t("reportBtn");
      document.getElementById("btn-report-close").setAttribute("aria-label", t("closeReport"));
      populateReportSelect();
      if (reportOpen) {
        document.getElementById("report-title").textContent = t("reportTitle");
        renderReportContent();
      }
      renderFooter();
      renderSources();
      renderMetricOptions();
      layerByAbbr.forEach((layer, abbr) => {
        if (layer.isPopupOpen()) layer.setPopupContent(buildReportPopupHtml(abbr));
      });
    }

    function bindToggles() {
      document.querySelectorAll("#year-toggle button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.year === year);
        btn.onclick = () => {
          year = btn.dataset.year;
          document.querySelectorAll("#year-toggle button").forEach(b =>
            b.classList.toggle("active", b.dataset.year === year));
          refreshMap();
        };
      });
      document.querySelectorAll("#lang-toggle button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
        btn.onclick = () => {
          lang = btn.dataset.lang;
          document.querySelectorAll("#lang-toggle button").forEach(b =>
            b.classList.toggle("active", b.dataset.lang === lang));
          renderControls();
          refreshMap();
        };
      });
      document.getElementById("btn-select-all").onclick = () => {
        METRIC_KEYS.forEach(k => selectedMetrics.add(k));
        renderMetricOptions();
        refreshMap();
      };
      document.getElementById("btn-clear-all").onclick = () => {
        selectedMetrics.clear();
        renderMetricOptions();
        refreshMap();
      };
      document.getElementById("btn-report").onclick = openReport;
      document.getElementById("btn-report-close").onclick = closeReport;
      document.getElementById("report-modal").onclick = e => {
        if (e.target.id === "report-modal") closeReport();
      };
      document.getElementById("state-report-select").onchange = e => {
        const abbr = e.target.value;
        if (abbr) openStateReportPopup(abbr);
      };
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && reportOpen) closeReport();
      });
    }

    let labelRAF = null;
    function scheduleLabelUpdate() {
      if (labelRAF) return;
      labelRAF = requestAnimationFrame(() => {
        labelRAF = null;
        updateLayerLabels();
      });
    }

    async function init() {
      if (location.protocol === "file:") {
        throw new Error(
          lang === "zh"
            ? "请通过本地服务器打开（双击 docs/serve.bat，再访问 http://localhost:8080/index.html）。直接打开 HTML 时浏览器会拦截数据加载。"
            : "Open via a local server (run docs/serve.bat, then visit http://localhost:8080/index.html). Opening the HTML file directly blocks data loading."
        );
      }
      const [dataResp, geoResp, linksResp] = await Promise.all([
        fetch("state_data.json"),
        fetch("https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json"),
        fetch("hfa_report_links.json"),
      ]);
      if (!dataResp.ok) throw new Error(`state_data.json HTTP ${dataResp.status}`);
      if (!geoResp.ok) throw new Error(`us-states.json HTTP ${geoResp.status}`);
      if (!linksResp.ok) throw new Error(`hfa_report_links.json HTTP ${linksResp.status}`);
      dataset = await dataResp.json();
      const geo = await geoResp.json();
      reportLinks = await linksResp.json();

      layerByAbbr.clear();
      if (stateLayer) map.removeLayer(stateLayer);
      stateLayer = L.geoJSON(geo, { style: styleFeature, onEachFeature }).addTo(map);
      // Fit contiguous U.S. (exclude AK/HI so the mainland fills the view)
      const contiguousBounds = L.latLngBounds();
      stateLayer.eachLayer(layer => {
        const abbr = STATE_ABBR[layer.feature?.properties?.name];
        if (abbr && abbr !== "AK" && abbr !== "HI") contiguousBounds.extend(layer.getBounds());
      });
      if (contiguousBounds.isValid()) {
        map.fitBounds(contiguousBounds, { padding: [4, 4], maxZoom: 8 });
        map.setZoom(map.getZoom() + Math.log2(1.17), { animate: false });
      } else {
        map.fitBounds(stateLayer.getBounds(), { padding: [20, 20] });
      }

      renderControls();
      bindToggles();
      refreshMap();
      initAnalytics();

      map.on("zoomend moveend resize viewreset", scheduleLabelUpdate);
    }

    init().catch(err => {
      document.getElementById("sidebar-hint").textContent = `Failed to load: ${err.message}`;
    });
  </script>
</body>
</html>
